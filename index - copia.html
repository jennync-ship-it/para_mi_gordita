<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi Gordita 💙</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.45), transparent 20%),
                radial-gradient(circle at 80% 30%, rgba(255,255,255,0.35), transparent 18%),
                linear-gradient(135deg, #dff6ff, #a9ddf5, #78c5ea);
            color: #164866;
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle 3s infinite ease-in-out;
            box-shadow: 0 0 12px white;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.25;
                transform: scale(0.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.4);
            }
        }

        .heart {
            position: fixed;
            bottom: -40px;
            color: rgba(255,255,255,0.8);
            font-size: 22px;
            animation: floatUp linear infinite;
            pointer-events: none;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            to {
                transform: translateY(-115vh) rotate(25deg);
                opacity: 0;
            }
        }

        .screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            position: relative;
            z-index: 2;
        }

        .card {
            width: min(520px, 92vw);
            padding: 55px 35px;
            text-align: center;
            border-radius: 35px;
            background: rgba(255,255,255,0.48);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow:
                0 20px 60px rgba(46, 137, 183, 0.25),
                inset 0 0 30px rgba(255,255,255,0.3);
        }

        .small-text {
            font-size: 17px;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(35px, 7vw, 58px);
            color: #247ba8;
            text-shadow: 0 0 18px rgba(255,255,255,0.9);
            margin-bottom: 20px;
        }

        .message {
            font-size: 19px;
            line-height: 1.7;
            color: #245b78;
            margin-bottom: 30px;
        }

        .lock {
            font-size: 38px;
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            max-width: 330px;
            padding: 14px 18px;
            border-radius: 30px;
            border: 2px solid rgba(255,255,255,0.8);
            outline: none;
            background: rgba(255,255,255,0.7);
            text-align: center;
            font-size: 16px;
            color: #245b78;
        }

        input:focus {
            box-shadow: 0 0 20px rgba(255,255,255,0.9);
        }

        button {
            margin-top: 15px;
            padding: 13px 30px;
            border: none;
            border-radius: 30px;
            background: #5db8df;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(53, 139, 180, 0.25);
        }

        button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 25px rgba(53, 139, 180, 0.4);
        }

        #error {
            margin-top: 15px;
            min-height: 24px;
            color: #b94c76;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .welcome {
            animation: appear 1.5s ease forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="stars">
        <span class="star" style="top:10%; left:15%;"></span>
        <span class="star" style="top:20%; left:75%;"></span>
        <span class="star" style="top:35%; left:40%;"></span>
        <span class="star" style="top:60%; left:85%;"></span>
        <span class="star" style="top:75%; left:25%;"></span>
        <span class="star" style="top:45%; left:10%;"></span>
        <span class="star" style="top:85%; left:65%;"></span>
        <span class="star" style="top:15%; left:50%;"></span>
    </div>

    <div class="screen" id="loginScreen">

        <div class="card">

            <div class="small-text">
                Hay un lugar que hice solo para ti... 💙
            </div>

            <h1>Para mi Gordita</h1>

            <div class="message">
                Pero primero tendrás que descubrir cómo entrar. ✨
                <br><br>
                6 días sin ti y mira lo que provocaste... 😭
            </div>

            <div class="lock">🔐</div>

            <input
                type="password"
                id="password"
                placeholder="Nuestra contraseña..."
            >

            <br>

            <button onclick="unlock()">
                Entrar, mi gordita ♡
            </button>

            <div id="error"></div>

        </div>

    </div>


    <div class="screen hidden" id="welcomeScreen">

        <div class="card welcome">

            <div class="lock">💙</div>

            <h1>Bienvenida, mi vida.</h1>

            <div class="message">
                Para mi Gordita,
                <br>
                de tu niña.
                <br><br>
                Esto lo hice pensando en ti.
            </div>

            <button onclick="alert('Aquí empieza nuestra historia... 💙')">
                Entrar ♡
            </button>

        </div>

    </div>


    <script>

        function unlock() {

            const password =
                document.getElementById("password").value
                .trim()
                .toLowerCase();

            const error =
                document.getElementById("error");

            if (password === "te amo cosita") {

                document.getElementById("loginScreen")
                    .classList.add("hidden");

                document.getElementById("welcomeScreen")
                    .classList.remove("hidden");

                createHearts();

            } else {

                error.textContent =
                    "Mmm... esa no es, mi gordita 👀💙";

            }
        }


        function createHearts() {

            for (let i = 0; i < 18; i++) {

                const heart =
                    document.createElement("div");

                heart.className = "heart";

                heart.textContent = "♡";

                heart.style.left =
                    Math.random() * 100 + "%";

                heart.style.animationDuration =
                    (6 + Math.random() * 6) + "s";

                heart.style.animationDelay =
                    Math.random() * 5 + "s";

                heart.style.fontSize =
                    (15 + Math.random() * 20) + "px";

                document.body.appendChild(heart);
            }
        }

    </script>

</body>
</html>
